<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title><style>
:root{color-scheme:dark;--bg:#111619;--line:#304044;--ink:#eef3f1;--muted:#a6b7b5;--accent:#e6b15c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Microsoft YaHei",system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:32px 26px 60px}h1{font-size:28px;margin:0 0 8px}p{margin:8px 0 18px;color:var(--muted)}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:7px;padding:10px 16px;color:var(--ink);background:#233035;cursor:pointer}button:first-child{background:var(--accent);color:#12362c;font-weight:700}button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;min-width:620px;table-layout:fixed}th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{background:#20302c;color:var(--accent);font-size:14px}th:nth-child(1){width:9%}th:nth-child(2){width:17%}th:nth-child(3){width:9%}td:nth-child(-n+3){font-size:14px;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}tbody tr:nth-child(even){background:#172023}.note{margin-top:14px;font-size:14px}.tip{color:var(--accent);border:1px solid var(--accent);border-radius:7px;padding:8px 12px;font-size:14px;margin:4px 0 14px}#status{font-size:13px;margin:10px 0;min-height:0}details{margin-top:16px;color:var(--muted);font-size:13px}summary{cursor:pointer}textarea{width:100%;height:230px;margin-top:10px;background:#192125;color:var(--ink);border:1px solid var(--line);padding:12px;resize:vertical}@media(max-width:660px){main{padding:20px 12px}h1{font-size:24px}table{min-width:0}td,th{padding:9px 5px;font-size:13px}td:nth-child(-n+3){font-size:12px}th:nth-child(1){width:11%}th:nth-child(2){width:24%}th:nth-child(3){width:12%}}@media print{.tools,details,#status,.tip{display:none}body{background:#fff;color:#111}main{padding:0}th,td{background:#fff!important;color:#111}table{min-width:0}}
</style></head><body><main><h1>时间总览</h1><p>{{TITLE}}｜{{SUMMARY}}</p><p class="tip" role="note">这是时间总览，方便你查看镜头和时长是否需要调整。没有问题请回复：出完整分镜提示词；有问题直接提出来，我按你的意见修改。</p><div class="tools"><button id="copy" type="button">复制时间总览</button><button id="download" type="button">下载 Markdown</button></div><div class="wrap"><table aria-label="分镜时间总览"><thead><tr><th>分镜号</th><th>时间</th><th>镜长</th><th>画面重点</th></tr></thead><tbody>{{ROWS}}</tbody></table></div>{{NOTES}}<p id="status" role="status" aria-live="polite"></p><details id="manual"><summary>手动复制</summary><textarea id="raw" readonly aria-label="时间总览原文">{{RAW}}</textarea></details></main>
<script id="copy-data" type="application/json">{{MARKDOWN}}</script><script>
'use strict';const text=JSON.parse(document.getElementById('copy-data').textContent);const status=document.getElementById('status');
async function copyAll(){try{await navigator.clipboard.writeText(text);status.textContent='已复制';return true;}catch(_){const field=document.createElement('textarea');field.value=text;field.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';document.body.appendChild(field);field.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}field.remove();if(ok){status.textContent='已复制';return true;}document.getElementById('manual').open=true;const raw=document.getElementById('raw');raw.focus();raw.select();status.textContent='已选中原文，请按 Ctrl+C 复制。';return false;}}
function download(){const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download={{DOWNLOAD}};a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.getElementById('copy').addEventListener('click',copyAll);document.getElementById('download').addEventListener('click',download);window.previewAPI={text,copyAll};
</script></body></html>
